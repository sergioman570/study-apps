<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Linux Trainer CST8207</title><meta name="theme-color" content="#1f8a4c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Linux Trainer"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>:root{--bg:#f7f5ef;--card:#fff;--ink:#1d2433;--muted:#5b6475;--acc:#2a62d8;--acc2:#e8f0ff;--ok:#1f8a4c;--okbg:#e5f6ec;--bad:#c0392b;--badbg:#fdecea;--warn:#a86a00;--line:#d9dde5;--r:16px;--fs:19px}
[data-theme=dark]{--bg:#14171d;--card:#1e232c;--ink:#eef1f6;--muted:#a9b2c3;--acc:#7aa7ff;--acc2:#24324d;--ok:#5fd28f;--okbg:#173626;--bad:#ff8a80;--badbg:#3d1f1d;--line:#333b48}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Arial,sans-serif;letter-spacing:.01em;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px}
header h1{font-size:1.05em;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:var(--acc2);color:var(--acc);border-radius:999px;padding:3px 10px;font-weight:700;font-size:.8em;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:14px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:.68em;padding:4px 2px;border-radius:10px}
nav.tabs a b{display:block;font-size:1.6em;line-height:1.1}
nav.tabs a.on{color:var(--acc);background:var(--acc2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:1.15em;margin:.1em 0 .5em}.card h3{font-size:1.02em;margin:.8em 0 .3em}
.muted{color:var(--muted)}.small{font-size:.85em}.center{text-align:center}
button,.btn{font:inherit;border:0;border-radius:14px;padding:14px 18px;min-height:52px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;text-align:center}
button.sec,.btn.sec{background:var(--acc2);color:var(--acc)}button.ghost{background:transparent;color:var(--acc);border:2px solid var(--line)}
button:disabled{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.stack>*{display:block;width:100%;margin:0 0 10px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);font-weight:500;margin:0 0 10px}
.opt.sel{border-color:var(--acc);background:var(--acc2)}.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.fb{border-radius:14px;padding:12px 14px;margin:12px 0}.fb.ok{background:var(--okbg);border-left:6px solid var(--ok)}.fb.bad{background:var(--badbg);border-left:6px solid var(--bad)}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input.ok{border-color:var(--ok);background:var(--okbg)}input.bad{border-color:var(--bad);background:var(--badbg)}
code,kbd,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
code{background:var(--acc2);padding:1px 6px;border-radius:6px}
pre{background:#10141b;color:#e8edf5;padding:12px;border-radius:12px;overflow:auto;font-size:.85em;line-height:1.45}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.prog{display:flex;gap:4px;margin:0 0 12px}.prog i{flex:1;height:8px;border-radius:9px;background:var(--line)}.prog i.d{background:var(--ok)}.prog i.c{background:var(--acc)}
.lesson{display:flex;gap:12px;align-items:center;padding:12px;border:2px solid var(--line);border-radius:14px;margin:0 0 10px;text-decoration:none;color:var(--ink);background:var(--card)}
.lesson .ic{font-size:1.5em;width:1.6em;text-align:center}.lesson.done{border-color:var(--ok)}.lesson.lock{opacity:.5}
.lesson .t{flex:1}.lesson .t small{display:block;color:var(--muted)}
svg.dia{width:100%;height:auto;max-height:420px;display:block;margin:8px 0}
.flash{min-height:210px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.15em;cursor:pointer;padding:22px}
.key{display:inline-block;border:1px solid var(--line);border-bottom-width:3px;border-radius:8px;padding:0 6px;font-family:ui-monospace,Menlo,monospace}
.big{font-size:1.6em;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table{border-collapse:collapse;width:100%;font-size:.9em}td,th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.bits{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}.bits button{min-width:44px;min-height:56px;padding:4px;font-family:ui-monospace,monospace;font-size:1.2em}
.bits .lbl{display:block;font-size:.55em;opacity:.8}
.tag{display:inline-block;font-size:.72em;padding:2px 8px;border-radius:99px;background:var(--acc2);color:var(--acc);margin:0 4px 4px 0;font-weight:700}
.warn{background:#fff6e0;border-left:6px solid var(--warn);padding:10px 12px;border-radius:12px}[data-theme=dark] .warn{background:#3a2f12}
.speak{background:transparent;color:var(--acc);border:2px solid var(--line);min-height:40px;padding:6px 10px;font-size:.85em}
details{margin:8px 0}summary{cursor:pointer;font-weight:700;color:var(--acc)}
.step{padding:8px 12px;border-left:4px solid var(--acc);background:var(--acc2);border-radius:8px;margin:6px 0}
.timer{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:9;font-weight:700}
</style></head><body><noscript>Turn on JavaScript to use this app.</noscript>
<script>/* ---- shared/diagrams.js ---- */
/* Inline SVG diagrams. Each returns an SVG string. Colors chosen to read in light and dark themes. */
window.D = (function () {
  const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.fs || 14}" text-anchor="${o.a || 'middle'}" fill="${o.c || 'currentColor'}" font-weight="${o.w || 400}" font-family="${o.mono ? 'ui-monospace,Menlo,monospace' : 'inherit'}">${s}</text>`;
  const R = (x, y, w, h, f, o = {}) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx ?? 8}" fill="${f}" stroke="${o.s || 'none'}" stroke-width="${o.sw || 2}"/>`;
  const svg = (w, h, inner, label) => `<svg class="dia" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label || 'diagram'}">${inner}</svg>`;
  const COL = ['#e57373', '#f0a35e', '#e6c84f', '#7cc576', '#4fb3bf', '#6f8fe0', '#a07ad6'];
  const D = {};
  D.osi = (hi) => { const L = ['7 Application', '6 Presentation', '5 Session', '4 Transport', '3 Network', '2 Data Link', '1 Physical']; const P = ['Data', 'Data', 'Data', 'Segment', 'Packet', 'Frame', 'Bits']; const E = ['HTTP DNS DHCP', '', '', 'TCP UDP ports', 'IP · router', 'MAC · switch', 'cables · hub'];
    let s = ''; L.forEach((l, i) => { const y = 10 + i * 46; s += R(10, y, 250, 40, COL[6 - i], { s: hi === 7 - i ? '#111' : 'none', sw: 4 }) + T(135, y + 26, l, { c: '#111', w: 700, fs: 16 }) + T(330, y + 26, P[i], { w: 700 }) + T(470, y + 26, E[i], { fs: 13 }); });
    s += R(560, 10, 130, 132, '#a07ad6') + T(625, 80, 'Application', { c: '#111', w: 700 }) + R(560, 148, 130, 40, '#7cc576') + T(625, 174, 'Transport', { c: '#111', w: 700 }) + R(560, 194, 130, 40, '#4fb3bf') + T(625, 220, 'Internet', { c: '#111', w: 700 }) + R(560, 240, 130, 86, '#6f8fe0') + T(625, 288, 'Network Access', { c: '#111', w: 700, fs: 13 });
    s += T(135, 345, 'OSI (7 layers)', { w: 700 }) + T(330, 345, 'PDU name', { w: 700 }) + T(470, 345, 'Examples', { w: 700 }) + T(625, 345, 'TCP/IP (4)', { w: 700 });
    return svg(700, 355, s, 'OSI model and TCP/IP model'); };
  D.encap = () => { let s = ''; const rows = [['Data', [['DATA', '#a07ad6']]], ['Segment', [['TCP/UDP hdr (ports)', '#7cc576'], ['DATA', '#a07ad6']]], ['Packet', [['IP hdr (IPs)', '#4fb3bf'], ['TCP hdr', '#7cc576'], ['DATA', '#a07ad6']]], ['Frame', [['Eth hdr (MACs)', '#6f8fe0'], ['IP', '#4fb3bf'], ['TCP', '#7cc576'], ['DATA', '#a07ad6'], ['FCS', '#6f8fe0']]], ['Bits', [['0101101001110100101…', '#ccc']]]];
    rows.forEach(([n, parts], i) => { const y = 10 + i * 52; s += T(60, y + 28, n, { w: 700 }); let x = 120; const W = { 'DATA': 110, 'FCS': 50 }; parts.forEach(([p, c]) => { const w = W[p] || (p.length > 12 ? 170 : 80); s += R(x, y, w, 40, c) + T(x + w / 2, y + 25, p, { c: '#111', fs: 12, w: 700 }); x += w + 4; }); });
    s += T(350, 280, 'Going DOWN = add a header (encapsulate). Going UP = remove it.', { fs: 14, w: 700 });
    return svg(700, 292, s, 'encapsulation'); };
  D.place = (v, showSum) => { const P = [128, 64, 32, 16, 8, 4, 2, 1]; let s = ''; let sum = [];
    P.forEach((p, i) => { const on = v !== undefined && (v & p); if (on) sum.push(p); const x = 10 + i * 84; s += R(x, 10, 76, 40, '#6f8fe0') + T(x + 38, 36, p, { c: '#fff', w: 700, fs: 18 }) + R(x, 56, 76, 50, on ? '#7cc576' : 'transparent', { s: '#888' }) + T(x + 38, 90, v === undefined ? '?' : on ? '1' : '0', { w: 800, fs: 26, mono: 1 }) + T(x + 38, 124, '2^' + (7 - i), { fs: 12 }); });
    if (v !== undefined && showSum !== false) s += T(340, 156, sum.length ? sum.join(' + ') + ' = ' + v : 'all 0 = 0', { w: 700, fs: 18 });
    return svg(680, 166, s, 'binary place values'); };
  D.ipBits = (ip, p) => { const b = ip.split('.').map(x => (+x).toString(2).padStart(8, '0')).join(''); let s = ''; for (let i = 0; i < 32; i++) { const row = Math.floor(i / 16), col = i % 16; const x = 6 + col * 22 + Math.floor(col / 8) * 10; const y = 28 + row * 70; s += R(x, y, 20, 32, i < p ? '#6f8fe0' : '#f0a35e', { rx: 3 }) + T(x + 10, y + 22, b[i], { c: '#111', w: 700, mono: 1, fs: 15 }); }
    ip.split('.').forEach((o, i) => { const row = Math.floor(i / 2), col = (i % 2) * 8; s += T(6 + col * 22 + (i % 2) * 10 + 87, 28 + row * 70 + 50, 'octet ' + (i + 1) + ': ' + o, { w: 700, fs: 13 }); });
    s += T(6, 18, `■ network ${p} bits`, { a: 'start', w: 700, c: '#4a6fd0', fs: 13 }) + T(370, 18, `■ host ${32 - p} bits`, { a: 'end', w: 700, c: '#d9822b', fs: 13 });
    return svg(376, 170, s, 'IP address bits'); };
  D.blocks = (blk, val, octName) => { const n = Math.min(256 / blk, 16); const w = 680 / n; let s = ''; for (let i = 0; i < n; i++) { const start = i * blk; const has = val >= start && val < start + blk; s += R(10 + i * w, 20, w - 4, 50, has ? '#7cc576' : i % 2 ? '#cfd8ea' : '#e3e9f5', { rx: 4 }) + T(10 + i * w + (w - 4) / 2, 50, start, { c: '#111', fs: n > 8 ? 11 : 14, w: has ? 800 : 400 }); }
    if (256 / blk > 16) s += T(690, 100, '… keeps going to 256', { a: 'end', fs: 12 });
    s += T(10, 14, `Blocks of ${blk} in the ${octName || 'interesting'} octet`, { a: 'start', fs: 13, w: 700 });
    if (val !== undefined) { const i = Math.floor(val / blk); if (i < n) s += T(10 + i * w + (w - 4) / 2, 92, '▲ ' + val + ' is here', { fs: 13, w: 700 }); }
    return svg(700, 104, s, 'subnet blocks'); };
  D.topo = (labels) => { labels = labels || {}; const dev = (x, y, kind, name, sub) => { let g = ''; if (kind === 'pc') g = R(x - 26, y - 20, 52, 34, '#6f8fe0') + R(x - 10, y + 14, 20, 8, '#6f8fe0', { rx: 2 }); if (kind === 'sw') g = R(x - 40, y - 16, 80, 32, '#4fb3bf') + T(x, y + 5, '⇄ ⇄', { c: '#111', w: 800 }); if (kind === 'r') g = `<circle cx="${x}" cy="${y}" r="24" fill="#f0a35e"/>` + T(x, y + 6, '✣', { c: '#111', fs: 20 }); return g + T(x, y + 44, name, { w: 700, fs: 13 }) + (sub ? T(x, y + 60, sub, { fs: 11, mono: 1 }) : ''); };
    let s = `<line x1="70" y1="60" x2="200" y2="60" stroke="#888" stroke-width="3"/><line x1="200" y1="60" x2="350" y2="60" stroke="#888" stroke-width="3"/><line x1="350" y1="60" x2="500" y2="60" stroke="#888" stroke-width="3"/><line x1="500" y1="60" x2="630" y2="60" stroke="#888" stroke-width="3"/>`;
    s += dev(70, 60, 'pc', 'PC-A', labels.a || '192.168.1.10') + dev(200, 60, 'sw', 'S1', labels.s1 || 'L2: MACs') + dev(350, 60, 'r', 'R1', labels.r || 'G0/0 .1 | G0/1 .1') + dev(500, 60, 'sw', 'S2', labels.s2 || '') + dev(630, 60, 'pc', 'PC-B', labels.b || '192.168.2.10');
    s += T(135, 140, labels.n1 || 'LAN 1: 192.168.1.0/24', { fs: 12, w: 700 }) + T(565, 140, labels.n2 || 'LAN 2: 192.168.2.0/24', { fs: 12, w: 700 });
    return svg(700, 150, s, 'network topology'); };
  D.arp = () => { let s = R(10, 20, 120, 40, '#6f8fe0') + T(70, 45, 'PC-A', { c: '#fff', w: 700 }); ['PC-B', 'PC-C', 'PC-D'].forEach((n, i) => s += R(560, 10 + i * 50, 120, 40, i === 1 ? '#7cc576' : '#cfd8ea') + T(620, 35 + i * 50, n + (i === 1 ? ' (.5)' : ''), { c: '#111', w: 700 }));
    s += `<path d="M130 40 L555 30 M130 40 L555 80 M130 40 L555 130" stroke="#e57373" stroke-width="2" stroke-dasharray="6 4" fill="none"/>` + T(340, 20, '① Request (broadcast FF-FF-FF-FF-FF-FF): "Who has .5?"', { fs: 13, w: 700, c: '#c0392b' });
    s += `<path d="M555 90 C 400 190, 250 190, 130 55" stroke="#1f8a4c" stroke-width="3" fill="none"/>` + T(340, 185, '② Reply (unicast): ".5 is at my MAC 00-1A-…"', { fs: 13, w: 700, c: '#1f8a4c' });
    return svg(700, 200, s, 'ARP'); };
  D.handshake = () => { let s = R(10, 10, 120, 36, '#6f8fe0') + T(70, 34, 'Client', { c: '#fff', w: 700 }) + R(570, 10, 120, 36, '#f0a35e') + T(630, 34, 'Server', { c: '#111', w: 700 }) + '<line x1="70" y1="46" x2="70" y2="230" stroke="#888"/><line x1="630" y1="46" x2="630" y2="230" stroke="#888"/>';
    [['① SYN', 70, 630, 80], ['② SYN-ACK', 630, 70, 135], ['③ ACK', 70, 630, 190]].forEach(([t, a, b, y]) => s += `<line x1="${a}" y1="${y}" x2="${b}" y2="${y + 20}" stroke="#2a62d8" stroke-width="3" marker-end="url(#ah)"/>` + T(350, y + 2, t, { w: 700 }));
    return svg(700, 240, '<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a62d8"/></marker></defs>' + s, 'TCP three-way handshake'); };
  D.tree = (hi) => { const kids = ['bin', 'boot', 'dev', 'etc', 'home', 'root', 'tmp', 'usr', 'var']; let s = R(320, 8, 60, 32, '#a07ad6') + T(350, 30, '/', { c: '#111', w: 800, fs: 20 }); kids.forEach((k, i) => { const x = 20 + i * 76; s += `<line x1="350" y1="40" x2="${x + 32}" y2="80" stroke="#888"/>` + R(x, 80, 66, 30, hi === k ? '#7cc576' : '#cfd8ea') + T(x + 33, 100, '/' + k, { c: '#111', fs: 13, w: 700, mono: 1 }); });
    s += '<line x1="356" y1="110" x2="300" y2="150" stroke="#888"/><line x1="356" y1="110" x2="420" y2="150" stroke="#888"/>' + R(250, 150, 100, 30, '#e3e9f5') + T(300, 170, 'sam', { c: '#111', fs: 13, mono: 1 }) + R(370, 150, 100, 30, '#e3e9f5') + T(420, 170, 'user1', { c: '#111', fs: 13, mono: 1 });
    s += '<line x1="300" y1="180" x2="300" y2="210" stroke="#888"/>' + R(230, 210, 140, 30, '#e3e9f5') + T(300, 230, 'Assignments', { c: '#111', fs: 13, mono: 1 }) + T(560, 172, '/home/sam = your HOME (~)', { fs: 13, w: 700 }) + T(560, 196, '/root = root\'s home (not /)', { fs: 13, w: 700 });
    return svg(700, 250, s, 'Linux file tree'); };
  D.perm = (str) => { str = str || '-rwxr-x---'; const grp = ['owner (u)', 'group (g)', 'others (o)']; let s = R(10, 30, 50, 50, '#ccc') + T(35, 62, str[0], { c: '#111', w: 800, fs: 22, mono: 1 }) + T(35, 100, 'type', { fs: 12 });
    for (let g = 0; g < 3; g++) { let n = 0; for (let k = 0; k < 3; k++) { const ch = str[1 + g * 3 + k]; const w = [4, 2, 1][k]; if (ch !== '-') n += w; const x = 80 + g * 205 + k * 62; s += R(x, 30, 56, 50, ch === '-' ? 'transparent' : COL[3 + g], { s: '#888' }) + T(x + 28, 62, ch, { w: 800, fs: 22, mono: 1, c: ch === '-' ? 'currentColor' : '#111' }) + T(x + 28, 100, w, { fs: 13 }); }
      s += T(80 + g * 205 + 90, 20, grp[g], { w: 700, fs: 13 }) + T(80 + g * 205 + 90, 128, '= ' + n, { w: 800, fs: 18 }); }
    return svg(700, 140, s, 'permission bits'); };
  D.fds = () => { let s = R(250, 50, 200, 70, '#6f8fe0') + T(350, 92, 'command', { c: '#fff', w: 800, fs: 18 }) + R(20, 60, 150, 50, '#cfd8ea') + T(95, 82, '0 stdin', { c: '#111', w: 700 }) + T(95, 100, 'keyboard  <', { c: '#111', fs: 12 }) + R(530, 20, 160, 50, '#7cc576') + T(610, 42, '1 stdout', { c: '#111', w: 700 }) + T(610, 60, 'screen  >  >>  |', { c: '#111', fs: 12 }) + R(530, 100, 160, 50, '#e57373') + T(610, 122, '2 stderr', { c: '#111', w: 700 }) + T(610, 140, 'screen  2>  2>&1', { c: '#111', fs: 12 });
    s += '<line x1="170" y1="85" x2="248" y2="85" stroke="#888" stroke-width="3"/><line x1="450" y1="70" x2="528" y2="45" stroke="#888" stroke-width="3"/><line x1="450" y1="100" x2="528" y2="125" stroke="#888" stroke-width="3"/>';
    return svg(700, 165, s, 'stdin stdout stderr'); };
  D.inode = () => { let s = R(10, 10, 250, 140, '#e3e9f5') + T(135, 32, 'Directory = name → inode #', { c: '#111', w: 700, fs: 13 }) + T(30, 62, 'f1        →  1234', { a: 'start', c: '#111', mono: 1 }) + T(30, 92, 'hardlink  →  1234', { a: 'start', c: '#111', mono: 1 }) + T(30, 122, 'f2        →  5678', { a: 'start', c: '#111', mono: 1 });
    s += R(400, 20, 280, 120, '#7cc576') + T(540, 44, 'Inode 1234', { c: '#111', w: 800 }) + T(540, 68, 'owner, perms, size, times,', { c: '#111', fs: 13 }) + T(540, 88, 'link count = 2, data blocks', { c: '#111', fs: 13 }) + T(540, 112, '(NO file name in here)', { c: '#111', fs: 13, w: 700 });
    s += '<line x1="200" y1="58" x2="398" y2="70" stroke="#1f8a4c" stroke-width="3"/><line x1="200" y1="88" x2="398" y2="80" stroke="#1f8a4c" stroke-width="3"/>';
    return svg(700, 160, s, 'inodes and hard links'); };
  D.cron = () => { const f = [['minute', '0-59'], ['hour', '0-23'], ['day of month', '1-31'], ['month', '1-12'], ['day of week', '0-7 (0,7=Sun)']]; let s = ''; f.forEach(([n, r], i) => { const x = 10 + i * 120; s += R(x, 10, 110, 44, COL[i + 1]) + T(x + 55, 38, ['30', '2', '*', '*', '1'][i], { c: '#111', w: 800, fs: 20, mono: 1 }) + T(x + 55, 76, n, { fs: 13, w: 700 }) + T(x + 55, 94, r, { fs: 12 }); });

    const weak = weakTopics().slice(0, 3);
    const todayPlan = C.planFor ? C.planFor(today(), ds) : null;
    return `<div class="card"><div class="row"><div><div class="big">🔥 ${streak()}</div><div class="small muted">day streak</div></div><div><div class="big">${S.xp}</div><div class="small muted">XP</div></div><div><div class="big">${doneN}/${lessons.length}</div><div class="small muted">lessons</div></div></div></div>
    <div class="card"><h2>Do this now (about 15 min)</h2><div class="stack">
      ${next ? `<a class="btn" href="#lesson/${next.id}">1. Lesson: ${esc(next.title)} <span class="small">(~${next.mins || 4} min)</span></a>` : '<div class="fb ok">All lessons done. Keep the reviews going.</div>'}
      <a class="btn sec" href="#cards">2. Flashcards due: ${due}</a>
      ${C.quickDrill ? `<a class="btn sec" href="${C.quickDrill.href}">3. ${C.quickDrill.label}</a>` : ''}
    </div>${todayPlan ? `<h3>Today's focus</h3><div>${todayPlan}</div>` : ''}</div>
    <div class="card"><h2>Coming up</h2>${up.map(d => `<div class="row" style="margin-bottom:8px"><div style="flex:3"><b>${esc(d.label)}</b><div class="small muted">${esc(d.when || '')}${d.confirmed ? '' : ' · <span style="color:var(--warn)">not confirmed</span>'}</div></div><div class="center"><span class="pill">${dayNum(d.date) - dayNum(today())} days</span></div></div>`).join('') || '<p class="muted">Nothing upcoming.</p>'}<a class="small" href="#dates">Edit dates</a></div>
    ${weak.length ? `<div class="card"><h2>Weak spots</h2>${weak.map(w => `<div>${esc(w.name)} <span class="muted small">${Math.round(w.s * 100)}%</span></div>`).join('')}<div style="height:10px"></div><a class="btn sec" href="#weak">Practice weak spots</a></div>` : ''}`;
  };
  VIEWS.learn = () => C.units.map(u => `<div class="card"><h2>${u.icon || '📘'} ${esc(u.title)}</h2>${u.sub ? `<p class="small muted">${u.sub}</p>` : ''}${(u.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}
    ${u.lessons.map(l => { const d = S.done[l.id], ok = unlocked(l); return `<a class="lesson ${d ? 'done' : ''} ${ok ? '' : 'lock'}" href="${ok ? '#lesson/' + l.id : '#learn'}" ${ok ? '' : 'onclick="return false"'}><span class="ic">${d ? '✅' : ok ? '▶️' : '🔒'}</span><span class="t">${esc(l.title)}<small>~${l.mins || 4} min${l.lab ? ' · 🔧 ' + esc(l.lab) : ''}</small></span></a>`; }).join('')}</div>`).join('') + `<p class="small muted center">Lessons unlock in order. Each one: example first, rule second, then practice until you get every question right.</p>`;
  VIEWS.cards = () => { setTimeout(cardsRun, 0); return '<div id="cardhost"></div>'; };
  function cardsRun() {
    let ids = srsDue(); const host = $('#cardhost'); if (!host) return;
    if (!ids.length) { const all = Object.keys(S.srs).length; host.innerHTML = `<div class="card center"><div class="big">🎉</div><p>No cards due right now.</p><p class="small muted">${all} cards in your deck. Cards join the deck when you finish a lesson. Missed quiz questions join too.</p><div class="stack"><button id="cram">Study all cards anyway</button>${all ? '' : '<a class="btn sec" href="#learn">Go do a lesson</a>'}</div></div>`; const b = $('#cram'); b.onclick = () => { ids = shuffle((C.cards || []).filter(c => S.srs[c.id] || !Object.keys(S.srs).length).map(c => c.id)); if (!ids.length) ids = shuffle((C.cards || []).map(c => c.id)); go(); }; return; }
    ids = shuffle(ids); go();
    function go() {
      let i = 0; const one = () => {
        if (i >= ids.length) { markDay(ids.length); host.innerHTML = `<div class="card center"><div class="big">✅ Deck done</div><p>${ids.length} cards reviewed.</p><a class="btn" href="#home">Home</a></div>`; return; }
        const id = ids[i]; const c = cardById[id];
        if (!c) { const q = bankById[id]; host.innerHTML = '<div class="card" id="qh"></div>'; renderQ(Object.assign({ topicName: 'Review: you missed this before' }, q), $('#qh'), ok => { srsGrade(id, ok); i++; one(); }); return; }
        host.innerHTML = `<div class="small muted center">${i + 1}/${ids.length} · box ${(S.srs[id] || { b: 0 }).b + 1} of ${GAPS.length}</div><div class="card flash" id="fc"><div id="sayme">${c.front}</div></div><div class="center small muted">Tap the card to flip</div>${sayBtn()}<div id="grade" style="display:none" class="row"><button class="ghost" id="no">😕 Didn't know</button><button id="yes">😀 Knew it</button></div>`;
        let flipped = false; $('#fc').onclick = () => { if (flipped) return; flipped = true; $('#sayme').innerHTML = `<div class="small muted">${c.front}</div><hr>${c.back}`; $('#grade').style.display = 'flex'; if (S.settings.autoSpeak) speak(c.back); };
        $('#no').onclick = () => { srsGrade(id, false); topicHit(c.topic, false); ids.push(id); i++; one(); };
        $('#yes').onclick = () => { srsGrade(id, true); topicHit(c.topic, true); i++; one(); };
      }; one();
    }
  }
  VIEWS.practice = () => `<div class="card"><h2>Practice</h2><p class="small muted">No timer unless you turn it on in Settings. Every answer explains why.</p><div class="stack">
    ${(C.practice || []).map((p, k) => `<a class="btn ${k ? 'sec' : ''}" href="#prac/${k}">${p.label}</a>`).join('')}
    <a class="btn sec" href="#weak">🎯 My weak spots</a><a class="btn sec" href="#mist">🔁 Questions I got wrong (${Object.keys(S.mistakes).length})</a></div></div>
    ${(C.tools || []).length ? `<div class="card"><h2>Tools</h2><div class="stack">${C.tools.map(t => `<a class="btn sec" href="#tool/${t.id}">${t.label}</a>`).join('')}</div></div>` : ''}`;
  VIEWS.mock = () => `<div class="card"><h2>Mock exams</h2><p class="small">These copy the real format as closely as we know it. Untimed by default. Turn on the timer in Settings to practise exam pace (extra time multiplier: ×${S.settings.extra}).</p></div>` + (C.mocks || []).map((mk, k) => { const past = S.mocks.filter(x => x.id === mk.id).slice(-3); return `<div class="card"><h2>${esc(mk.title)}</h2><p class="small">${mk.desc}</p>${past.length ? `<p class="small muted">Last scores: ${past.map(p => p.pct + '% (' + p.date + ')').join(', ')}</p>` : ''}<a class="btn" style="width:100%" href="#mockrun/${k}">Start</a></div>`; }).join('');
  VIEWS.plan = () => { const ds = datesList(); return `<div class="card"><h2>Plan to exam day</h2><p class="small muted">Short sessions: 2–3 blocks of 15 min a day. Lighter on long class days. Edit dates when your profs confirm them.</p></div>` + (C.planRows ? C.planRows(today(), ds) : '') + `<div class="card"><a class="btn sec" href="#dates" style="width:100%">Edit exam dates</a></div>`; };
  VIEWS.dates = () => { const ds = datesList(); setTimeout(() => { document.querySelectorAll('[data-d]').forEach(inp => inp.onchange = () => { const k = inp.dataset.d; S.dates[k] = Object.assign(S.dates[k] || {}, { date: inp.value }); save(); toast('Saved'); }); document.querySelectorAll('[data-c]').forEach(cb => cb.onchange = () => { const k = cb.dataset.c; S.dates[k] = Object.assign(S.dates[k] || {}, { confirmed: cb.checked }); save(); }); }, 0);
    return `<div class="card"><h2>Exam and test dates</h2><p class="small muted">Some dates conflict between sources. Change them here when confirmed; the plan updates.</p>${ds.map(d => `<div style="margin:0 0 14px"><b>${esc(d.label)}</b><div class="small muted">${esc(d.when || '')}<br>Source: ${esc(d.src || '')}</div><input type="date" data-d="${d.key}" value="${d.date}"><label class="small"><input type="checkbox" data-c="${d.key}" ${d.confirmed ? 'checked' : ''}> Confirmed</label></div>`).join('')}</div>`; };
  VIEWS.progress = () => { const rows = Object.keys(S.topics).map(t => ({ t, s: topicScore(t), r: S.topics[t] })).sort((a, b) => (a.s ?? 1) - (b.s ?? 1));
    const doneN = lessons.filter(l => S.done[l.id]).length; const days = Object.keys(S.days).sort().slice(-14);
    return `<div class="card"><h2>Progress</h2><p>Lessons: ${doneN}/${lessons.length}</p><div class="bar"><i style="width:${100 * doneN / lessons.length}%"></i></div><p>Cards in deck: ${Object.keys(S.srs).length} · mastered (box 5+): ${Object.values(S.srs).filter(c => c.b >= 4).length}</p><p>Streak: ${streak()} days · XP ${S.xp}</p></div>
    <div class="card"><h2>Topics (last 10 answers)</h2>${rows.length ? `<table>${rows.map(x => `<tr><td>${esc((C.topicNames || {})[x.t] || x.t)}</td><td style="width:40%"><div class="bar"><i style="width:${Math.round((x.s || 0) * 100)}%;background:${x.s < .6 ? 'var(--bad)' : x.s < .8 ? 'var(--warn)' : 'var(--ok)'}"></i></div></td><td>${Math.round((x.s || 0) * 100)}%</td></tr>`).join('')}</table>` : '<p class="muted">Answer some questions first.</p>'}</div>
    <div class="card"><h2>Mock exams</h2>${S.mocks.length ? `<table>${S.mocks.slice(-10).map(x => `<tr><td>${x.date}</td><td>${esc(((C.mocks || []).find(m => m.id === x.id) || {}).title || x.id)}</td><td>${x.pct}%</td></tr>`).join('')}</table>` : '<p class="muted">None yet.</p>'}</div>
    <div class="card"><h2>Days studied</h2><p class="small">${days.map(d => d.slice(5)).join(' · ') || 'none yet'}</p></div>`; };
  VIEWS.settings = () => { setTimeout(() => {
      $('#fs').oninput = e => { S.settings.fs = +e.target.value; applySettings(); save(); };
      $('#th').onchange = e => { S.settings.theme = e.target.value; applySettings(); save(); };
      $('#as').onchange = e => { S.settings.autoSpeak = e.target.checked; save(); };
      $('#tm').onchange = e => { S.settings.timer = e.target.checked; save(); };
      $('#ex').onchange = e => { S.settings.extra = +e.target.value; save(); };
      $('#exp').onclick = () => { const blob = new Blob([JSON.stringify(S)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = C.id + '-progress-' + today() + '.json'; a.click(); };
      $('#imp').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { S = Object.assign(blank(), JSON.parse(t)); save(); toast('Progress loaded'); route(); } catch (er) { toast('That file did not work'); } }); };
      $('#rst').onclick = () => { if (confirm('Erase all progress for this app?')) { S = blank(); save(); route(); } };
    }, 0);
    return `<div class="card"><div class="stack"><a class="btn sec" href="#progress">📈 My progress</a><a class="btn sec" href="#dates">📅 Exam dates</a><a class="btn sec" href="#help">❓ How to install on iPhone / Mac</a></div></div><div class="card"><h2>Settings</h2><label>Text size</label><input id="fs" type="range" min="16" max="26" value="${S.settings.fs}" style="width:100%"><label>Theme</label><select id="th"><option value="light" ${S.settings.theme === 'light' ? 'selected' : ''}>Light</option><option value="dark" ${S.settings.theme === 'dark' ? 'selected' : ''}>Dark</option></select>
    <p><label><input type="checkbox" id="as" ${S.settings.autoSpeak ? 'checked' : ''}> Read every screen aloud automatically</label></p>
    <p><label><input type="checkbox" id="tm" ${S.settings.timer ? 'checked' : ''}> Timer on for mock exams and drills</label></p>
    <label>Extra-time multiplier for mock exams</label><select id="ex">${[1, 1.25, 1.5, 2].map(v => `<option ${S.settings.extra == v ? 'selected' : ''}>${v}</option>`).join('')}</select><p class="small muted">Set this to match any extra test time you get (1 = none).</p></div>
    <div class="card"><h2>Move progress between phone and Mac</h2><p class="small">Progress lives on each device. Save a file on one, load it on the other.</p><div class="stack"><button id="exp" class="sec">Save progress file</button><label class="btn sec">Load progress file<input id="imp" type="file" accept=".json,application/json" style="display:none"></label><button id="rst" class="ghost">Erase progress</button></div></div>
    <div class="card small muted">${C.about || ''}</div>`; };
  VIEWS.help = () => `<div class="card"><h2>Install on iPhone</h2><ol><li>Open the app's web link in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (square with arrow).</li><li>Tap <b>Add to Home Screen</b>, then <b>Add</b>.</li><li>Open it once with internet. After that it works offline.</li></ol><h2>On the Mac</h2><p>Open the same link in Safari and choose <b>File → Add to Dock</b>, or in Chrome use the install icon in the address bar. You can also just double-click <code>index.html</code> in the downloaded folder.</p><p class="small muted">Progress is saved separately on each device and each browser. Use Settings → Save progress file to move it.</p></div>`;
  // ---------- dates ----------
  function datesList() { return (C.dates || []).map(d => Object.assign({}, d, S.dates[d.key] || {})).sort((a, b) => a.date < b.date ? -1 : 1); }
  window.__dates = datesList;
  function weakTopics() { return Object.keys(S.topics).map(t => ({ t, name: (C.topicNames || {})[t] || t, s: topicScore(t), n: (S.topics[t].last || []).length })).filter(x => x.n >= 3 && x.s < 0.8).sort((a, b) => a.s - b.s); }
  // ---------- router ----------
  function applySettings() { document.documentElement.style.setProperty('--fs', S.settings.fs + 'px'); document.documentElement.dataset.theme = S.settings.theme; }
  function route() {
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    const h = (location.hash || '#home').slice(1); const [v, arg] = h.split('/');
    document.querySelectorAll('nav.tabs a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + v));
    $('#streak').textContent = '🔥 ' + streak();
    const m = $('main'); window.scrollTo(0, 0);
    if (v === 'lesson' && lessonById[arg]) return runLesson(lessonById[arg]);
    if (v === 'prac' && C.practice[+arg]) { const p = C.practice[+arg]; return runQuiz(p.label, buildMix(p.mix), { minutes: S.settings.timer ? p.minutes : 0 }); }
    if (v === 'weak') { const w = weakTopics().map(x => x.t); if (!w.length) { m.innerHTML = `<div class="card center"><p>No weak spots yet (you need 3+ answers in a topic under 80%).</p><a class="btn" href="#practice">Practice</a></div>`; return; }
      const items = shuffle((C.bank || []).filter(q => w.includes(q.topic))).slice(0, 12); Object.entries(C.genTopics || {}).forEach(([g, t]) => { if (w.includes(t)) for (let k = 0; k < 3; k++) items.push(genQ(g)); }); return runQuiz('Weak spots', shuffle(items).slice(0, 15)); }
    if (v === 'mist') { const items = Object.keys(S.mistakes).map(id => bankById[id]).filter(Boolean); if (!items.length) { m.innerHTML = '<div class="card center"><p>No saved mistakes. 👍</p></div>'; return; } return runQuiz('My mistakes', shuffle(items).slice(0, 15)); }
    if (v === 'mockrun' && C.mocks[+arg]) { const mk = C.mocks[+arg]; return runQuiz(mk.title, buildMix(mk.mix), { minutes: S.settings.timer ? mk.minutes : 0, extra: S.settings.extra, pass: mk.pass, mock: mk.id }); }
    if (v === 'tool') { const t = (C.tools || []).find(x => x.id === arg); if (t) { m.innerHTML = '<div id="tool"></div>'; t.render($('#tool'), { renderQ, speak, sayBtn, S, save, markDay, topicHit, genQ, runQuiz }); return; } }
    m.innerHTML = (VIEWS[v] || VIEWS.home)();
  }
  window.ENGINE = { renderQ, runQuiz, speak, sayBtn, shuffle, pick, esc, today, dayNum, S: () => S, save, markDay, topicHit, genQ };
  function boot() {
    applySettings();
    document.title = C.title;
    document.body.insertAdjacentHTML('afterbegin', `<header><h1>${C.icon || ''} ${esc(C.short)}</h1><span class="pill" id="streak"></span></header><main></main>
    <nav class="tabs"><a href="#home"><b>🏠</b>Today</a><a href="#learn"><b>📚</b>Learn</a><a href="#practice"><b>✏️</b>Practice</a><a href="#cards"><b>🃏</b>Cards</a><a href="#mock"><b>📝</b>Mock</a><a href="#plan"><b>📅</b>Plan</a><a href="#settings"><b>⚙️</b>More</a></nav>`);
    window.addEventListener('hashchange', route); route();
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script></body></html>
